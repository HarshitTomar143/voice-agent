<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="startMic()">Start Mic</button>
</body>

<script>
    async function startMic(){
        const stream = await navigator.mediaDevices.getUserMedia({audio:true})
        
        const context = new AudioContext()
        const sample_rate = context.sampleRate
        const source = context.createMediaStreamSource(stream);
        
        
        await context.audioWorklet.addModule('processor.js');
        
        const node = new AudioWorkletNode(context, 'mic-processor');


        const socket = new WebSocket('ws://localhost:8000/ws');
        socket.onopen = () => {
            console.log('connected!');
            node.port.onmessage = (event) => { socket.send(event.data); };
            source.connect(node);
        }

        socket.onmessage = async (event) => {
            const arrayBuffer = await event.data.arrayBuffer()
            const samples = new Float32Array(arrayBuffer);

            const audioBuffer = context.createBuffer(1, samples.length, context.sampleRate)
            audioBuffer.copyToChannel(samples,0)

            const player = context.createBufferSource();
            player.buffer = audioBuffer;
            player.connect(context.destination);
            player.start();
        }
    }
</script>
</html>
